name: Public release truth

on:
  pull_request:
    paths:
      - public/llms.txt
      - public/llms-full.txt
      - public/release-truth.json
      - src/data/release-truth.json
      - src/components/ReleaseTruth.tsx
      - src/components/DiffGraphProof.tsx
      - src/data/daily-driver-fixture.json
      - public/examples/daily-driver-fixture.json
      - public/examples/daily-driver-review-task.json
      - src/data/daily-driver-review-task.json
      - public/examples/greeting.diff
      - public/examples/greeting-structural.json
      - src/pages/Index.tsx
      - scripts/sync-release-truth.mjs
      - scripts/validate-acceptance-fixture.mjs
      - scripts/validate-review-task-protocol.mjs
      - scripts/validate-public-llms.mjs
      - .github/workflows/public-release-truth.yml
  push:
    branches: [main]
    paths:
      - public/llms.txt
      - public/llms-full.txt
      - public/release-truth.json
      - src/data/release-truth.json
      - src/components/ReleaseTruth.tsx
      - src/components/DiffGraphProof.tsx
      - src/data/daily-driver-fixture.json
      - public/examples/daily-driver-fixture.json
      - public/examples/daily-driver-review-task.json
      - src/data/daily-driver-review-task.json
      - public/examples/greeting.diff
      - public/examples/greeting-structural.json
      - src/pages/Index.tsx
      - scripts/sync-release-truth.mjs
      - scripts/validate-acceptance-fixture.mjs
      - scripts/validate-review-task-protocol.mjs
      - scripts/validate-public-llms.mjs
      - .github/workflows/public-release-truth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate synchronized claims and public links
        run: |
          node scripts/sync-release-truth.mjs --check
          node scripts/validate-acceptance-fixture.mjs
          node scripts/validate-review-task-protocol.mjs
          node scripts/validate-public-llms.mjs --check-links
